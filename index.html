<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#292e3a"><title>Zahlenquadrat</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#39e6ed;background:#292e3a}*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:1500px;margin:auto;padding:12px 18px 30px;text-align:center}header{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}button,select,input{font:inherit}button,select{border:2px solid #39e6ed;border-radius:12px;background:#39e6ed;color:#242b38;font-weight:700;padding:9px 13px}button:active{filter:brightness(.8)}label{display:inline-flex;align-items:center;gap:7px}.stepper{display:inline-flex;align-items:center;position:relative}.step-arrows{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1px;z-index:1}.step-arrows button{font-size:10px;line-height:1;padding:0 3px;min-width:19px;min-height:16px;border-radius:3px;touch-action:manipulation}input[type=number]{appearance:textfield;-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{width:76px;background:#1c2230;color:#fff;border:1px solid #5b6b7d;border-radius:8px;padding:7px 25px 7px 8px}#clock{font-size:clamp(32px,5vw,62px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}#grid{display:grid;margin:12px auto;gap:2px;width:min(94vw,calc(100dvh - 260px),1050px);aspect-ratio:1;touch-action:manipulation;user-select:none} .cell{display:flex;justify-content:center;align-items:center;background:#3de5ec;color:#252c39;font-weight:850;font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;border:0;border-radius:0;padding:0;min-width:0;cursor:pointer}.cell.done{background:#7a919a;color:#25303b}.cell.wrong{background:#ff6c72}#next{font-size:clamp(22px,3vw,35px);font-weight:750}#status{min-height:24px;color:#e7f8fb}#results{color:#fff;margin:12px auto;max-width:750px;font-size:18px} .result-lists{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left;margin-top:14px}.result-lists section{background:#202735;border-radius:12px;padding:12px}.result-lists h3{margin:0 0 8px;color:#39e6ed;font-size:18px}.result-lists ol{margin:0;padding-left:30px}.result-lists li{padding:3px 0;font-variant-numeric:tabular-nums}@media(max-width:520px){.result-lists{gap:8px}.result-lists section{padding:8px}.result-lists h3{font-size:15px}} .sub{color:#b7c8d4;font-size:14px} .controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap} @media(max-width:700px){main{padding:8px}header{gap:8px}#grid{width:min(98vw,calc(100dvh - 235px));}button,select{padding:7px}} </style></head><body><main><header><label>Reihen <span class="stepper"><input id="rows" type="number" min="1" max="99" step="1" value="5"><span class="step-arrows"><button type="button" data-step="rows:1" aria-label="Reihen um 1 erhöhen">▲</button><button type="button" data-step="rows:-1" aria-label="Reihen um 1 verringern">▼</button></span></span></label><label>Spalten <span class="stepper"><input id="cols" type="number" min="1" max="99" step="1" value="5"><span class="step-arrows"><button type="button" data-step="cols:1" aria-label="Spalten um 1 erhöhen">▲</button><button type="button" data-step="cols:-1" aria-label="Spalten um 1 verringern">▼</button></span></span></label><span id="count">25 Zahlen</span><button id="new">Neu mischen</button><button id="start">Start</button><button id="sound">Ton: Ein</button></header><div class="sub">Zeit</div><div id="clock">0:00.00</div><div id="grid" aria-label="Zahlenquadrat"></div><div id="next">Nächste Zahl: 1</div><div id="status">Start drücken, dann Zahlen aufsteigend berühren.</div><div id="results"></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let nums=[],current=1,errors=0,running=false,started=0,elapsed=0,raf=0,audio=null,sound=true,hitTimes=[],lastHitAt=0;const format=ms=>{let cs=Math.floor(ms/10),m=Math.floor(cs/6000);return m+':'+String(Math.floor(cs/100)%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0')};function beep(ok){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=ok?820:220;g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.1)}catch(e){}}function tick(){if(!running)return;elapsed=performance.now()-started;$('clock').textContent=format(elapsed);raf=requestAnimationFrame(tick)}function stop(){running=false;cancelAnimationFrame(raf)}function setup(){stop();let r=Math.max(1,Math.min(99,parseInt($('rows').value)||5)),c=Math.max(1,Math.min(99,parseInt($('cols').value)||5));if(r*c>99){c=Math.max(1,Math.floor(99/r));$('cols').value=c} $('rows').value=r;$('cols').value=c;let n=r*c;nums=Array.from({length:n},(_,i)=>i+1);for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}current=1;errors=0;elapsed=0;hitTimes=[];lastHitAt=0;$('clock').textContent='0:00.00';$('next').textContent='Nächste Zahl: 1';$('status').textContent='Start drücken, dann Zahlen aufsteigend berühren.';$('results').textContent='';$('count').textContent=n+' Zahlen';$('start').textContent='Start';let grid=$('grid');grid.replaceChildren();grid.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;grid.style.setProperty('--cols',Math.max(r,c));nums.forEach(num=>{let b=document.createElement('button');b.className='cell';b.textContent=num;b.type='button';b.setAttribute('aria-label','Zahl '+num);b.onclick=()=>hit(num,b);grid.append(b)});fitNumbers()}function showResults(){const results=$('results');results.replaceChildren();const summary=document.createElement('p');const average=hitTimes.reduce((sum,x)=>sum+x.ms,0)/hitTimes.length;summary.textContent='Gesamtzeit: '+format(elapsed)+' · Fehler: '+errors+' · Ø Trefferzeit: '+Math.round(average)+' ms';results.append(summary);const wrap=document.createElement('div');wrap.className='result-lists';const ordered=[...hitTimes].sort((a,b)=>a.ms-b.ms);for(const [heading,entries] of [['5 schnellste Treffer',ordered.slice(0,5)],['5 langsamste Treffer',ordered.slice(-5).reverse()]]){const section=document.createElement('section');const title=document.createElement('h3');title.textContent=heading;section.append(title);const list=document.createElement('ol');for(const entry of entries){const li=document.createElement('li');li.textContent='Zahl '+entry.number+': '+Math.round(entry.ms)+' ms';list.append(li)}section.append(list);wrap.append(section)}results.append(wrap)}function fitNumbers(){const grid=$('grid');const r=Number($('rows').value),c=Number($('cols').value);if(!r||!c)return;const box=grid.getBoundingClientRect();const side=Math.min((box.width-(c-1)*2)/c,(box.height-(r-1)*2)/r);grid.querySelectorAll('.cell').forEach(b=>{const digits=b.textContent.length;const factor=digits===1?.66:digits===2?.43:.31;b.style.fontSize=Math.max(7,Math.min(80,side*factor))+'px'})}new ResizeObserver(fitNumbers).observe($('grid'));function hit(n,b){if(!running)return;if(n===current){const now=performance.now();hitTimes.push({number:n,ms:now-lastHitAt});lastHitAt=now;b.classList.add('done');beep(true);current++;if(current>nums.length){elapsed=performance.now()-started;stop();$('clock').textContent=format(elapsed);$('next').textContent='Geschafft!';$('status').textContent='Alle '+nums.length+' Zahlen gefunden.';showResults();$('start').textContent='Start';}else{$('next').textContent='Nächste Zahl: '+current}}else{errors++;beep(false);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),170);$('status').textContent='Fehler: '+errors}}$('start').onclick=()=>{if(running){elapsed=performance.now()-started;stop();$('start').textContent='Weiter';$('status').textContent='Pausiert';return}if(current>nums.length)setup();running=true;started=performance.now()-elapsed;lastHitAt=performance.now();$('start').textContent='Pause';$('status').textContent='Fehler: '+errors;tick()};$('new').onclick=setup;$('rows').onchange=setup;$('cols').onchange=setup;document.querySelectorAll('[data-step]').forEach(btn=>{btn.addEventListener('click',()=>{const [id,delta]=btn.dataset.step.split(':');const input=$(id);const other=$(id==='rows'?'cols':'rows');let value=Math.max(1,Math.min(99,(parseInt(input.value)||1)+Number(delta)));value=Math.min(value,Math.floor(99/(parseInt(other.value)||1)));input.value=value;setup()})});$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Ton: '+(sound?'Ein':'Aus')};setup()})();</script></body></html>
